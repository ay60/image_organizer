[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-organizer"
version = "0.1.0"
description = "A non-destructive desktop image metadata organizer"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "PySide6>=6.7"]

[tool.setuptools]
packages = ["organizer"]
